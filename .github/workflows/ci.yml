name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.7', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install dcc-mcp-core==0.20.44 pyyaml jsonschema
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q skill tests
